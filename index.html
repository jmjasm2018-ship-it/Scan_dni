<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Registro de DNI</title>
  <link rel="stylesheet" href="style.css">
  <!-- ZXing Decoder Library -->
  <script src="https://unpkg.com/@zxing/library@latest/umd/index.min.js"></script>
</head>
<body>

  <div class="container">
    <header class="header">
      <h1>Registro de DNI</h1>
      <p>Escaneo rápido de documentos de identidad</p>
    </header>

    <!-- Sección de Escaneo -->
    <main class="card">
      <button id="btnScan" class="btn btn-primary btn-large">
        📷 ESCANEAR DNI
      </button>

      <!-- Visor de Cámara (Oculto por defecto) -->
      <div id="scannerContainer" class="scanner-container hidden">
        <video id="video" class="video-preview"></video>
        <div class="scanner-overlay">
          <div class="target-box"></div>
        </div>
        <button id="btnCancelScan" class="btn btn-danger btn-stop">Cancelar Escaneo</button>
      </div>

      <!-- Notificaciones / Alertas -->
      <div id="alertBox" class="alert hidden"></div>

      <!-- Tarjeta de Confirmación de Datos -->
      <div id="dataCard" class="data-card hidden">
        <h3>Datos Detectados</h3>
        <form id="dniForm">
          <div class="form-group">
            <label for="dni">DNI / Documento:</label>
            <input type="text" id="dni" class="form-control" placeholder="00000000" required>
          </div>
          <div class="form-group">
            <label for="apellidos">Apellidos:</label>
            <input type="text" id="apellidos" class="form-control" placeholder="Apellidos paterno y materno">
          </div>
          <div class="form-group">
            <label for="nombres">Nombres:</label>
            <input type="text" id="nombres" class="form-control" placeholder="Nombres completos">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="fechaNac">F. Nacimiento:</label>
              <input type="text" id="fechaNac" class="form-control" placeholder="DD/MM/AAAA">
            </div>
            <div class="form-group">
              <label for="sexo">Sexo:</label>
              <input type="text" id="sexo" class="form-control" placeholder="M / F">
            </div>
          </div>
          <div class="actions">
            <button type="button" id="btnSave" class="btn btn-success">GUARDAR REGISTRO</button>
            <button type="button" id="btnDiscard" class="btn btn-secondary">CANCELAR</button>
          </div>
        </form>
      </div>
    </main>

    <!-- Historial de Registros -->
    <section class="card">
      <div class="history-header">
        <h2>Últimos registros</h2>
        <button id="btnRefreshHistory" class="btn-icon" title="Actualizar">🔄</button>
      </div>
      <div class="table-wrapper">
        <table class="data-table">
          <thead>
            <tr>
              <th>Fecha/Hora</th>
              <th>DNI</th>
              <th>Nombres y Apellidos</th>
            </tr>
          </thead>
          <tbody id="historyBody">
            <tr>
              <td colspan="3" class="text-center">Cargando registros...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
